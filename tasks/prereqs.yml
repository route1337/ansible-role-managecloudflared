# Manage prerequisites for this role

- name: Find the legacy cloudflared apt sources
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: '*.list*'
    contains: '.*pkg\.cloudflare\.com.*'
  register: legacy_cloudflared_source

- name: Remove the legacy cloudflared apt sources
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: absent
  loop: "{{ legacy_cloudflared_source.files }}"
  loop_control:
    label: '{{ item.path | default("") | basename }}'

- name: Remove the legacy cloudflared keyrings
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - /usr/share/keyrings/cloudflared.gpg
    - /usr/share/keyrings/cloudflared.gpg_armored
    - /etc/apt/keyrings/cloudflared.asc

- name: Make sure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add the cloudflared GPG key
  ansible.builtin.get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /etc/apt/keyrings/cloudflared.gpg
    owner: root
    group: root
    mode: "0644"

- name: Add the cloudflared repository
  ansible.builtin.deb822_repository:
    name: cloudflared
    types: deb
    uris: https://pkg.cloudflare.com/cloudflared
    suites: "{{ cloudflared_apt_suite }}"
    components: main
    architectures: "{{ cloudflared_arch }}"
    signed_by: /etc/apt/keyrings/cloudflared.gpg
    state: present
  vars:
    cloudflared_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"

- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install cloudflared
  ansible.builtin.apt:
    name: cloudflared
    state: latest

- name: Configure cloudflared directory
  ansible.builtin.file:
    path: "/etc/cloudflared"
    owner: root
    group: root
    mode: "0755"
    state: directory
