# Configure some sysctl parameters for a smoother QUIC experience

- name: Increase the maximum socket buffer sizes for QUIC
  ansible.posix.sysctl:
    name: '{{ item }}'
    value: '7500000'
    state: present
    reload: true
  loop:
    - net.core.rmem_max
    - net.core.wmem_max
